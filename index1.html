<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>💗</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6dcf7;--bg2:#f1e9fb;--pink:#ff8fb8;--pink2:#ff6fa3;--blue:#a9d8ff;--blue2:#7cc1f5;--ink:#4a2f5e;--card-ink:#fff;--yellow:#f6c945;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#d9cdf0;--bg2:#e8def8}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--ink);font-family:'Cairo',Tahoma,Arial,sans-serif;min-height:100vh;padding:20px 14px 40px;text-align:center;overflow-x:hidden}
h1{font-size:1.6rem;margin:10px 0 4px}
h2{font-size:1.2rem;margin:34px 0 14px}
.sub{opacity:.75;font-size:.95rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:460px;margin:0 auto}
.flip{perspective:900px;height:250px;cursor:pointer}
.in{position:relative;width:100%;height:100%;transition:transform .7s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.f,.b{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;padding:10px;box-shadow:0 6px 16px rgba(255,111,163,.3)}
.f{background:var(--pink);color:var(--card-ink);font-size:2.6rem}
.b{background:linear-gradient(160deg,#ffb3d0,var(--pink2));color:var(--card-ink);transform:rotateY(180deg);font-size:.82rem;line-height:1.6;overflow:auto;font-weight:600}
.b.s{font-size:.7rem;line-height:1.5}
.note{max-width:460px;margin:0 auto;background:rgba(255,255,255,.55);border-radius:16px;padding:14px;line-height:1.8;font-weight:600}
.pr{max-width:460px;margin:14px auto;background:linear-gradient(160deg,#cdeaff,var(--blue2));color:#18456b;border-radius:20px;padding:26px 14px;font-weight:700;cursor:pointer;box-shadow:0 6px 16px rgba(124,193,245,.4)}
.pr:active{transform:scale(.98)}
.ov{position:fixed;inset:0;background:rgba(230,220,247,.45);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);display:none;align-items:center;justify-content:center;padding:22px;z-index:10}
.ov.on{display:flex}
.msg{max-width:440px;max-height:85vh;overflow:auto;background:rgba(255,255,255,.75);border-radius:22px;padding:24px 20px;line-height:1.9;font-weight:600;box-shadow:0 10px 30px rgba(74,47,94,.2);animation:pop .35s}
.msg small{display:block;margin-top:16px;font-size:.72rem;opacity:.65;font-weight:400}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.cnt{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:460px;margin:0 auto}
.u{min-width:64px;background:rgba(255,255,255,.6);border-radius:14px;padding:10px 6px}
.u b{display:block;font-size:1.6rem;color:var(--pink2)}
.u.y b{color:var(--yellow)}
.u span{font-size:.78rem}
.hearts{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.hearts i{position:absolute;bottom:-30px;font-style:normal;opacity:.5;animation:up linear infinite}
@keyframes up{to{transform:translateY(-110vh)}}
main{position:relative;z-index:1}
</style>
<meta name="robots" content="noindex,nofollow">
<style>
body{background:#ebe2f9;transition:background-color 1.8s ease}
body.blue{background:#d4ebff}
body.pink{background:#ffe3ee}
#lock{max-width:340px;margin:18vh auto 0;background:rgba(255,255,255,.6);border-radius:22px;padding:26px 18px}
#lock input{width:100%;font:inherit;font-size:1.2rem;text-align:center;padding:12px;border:2px solid #ff8fb8;border-radius:14px;background:#fff;color:#4a2f5e;margin:14px 0;direction:ltr}
#lock button{font:inherit;font-weight:700;background:#ff6fa3;color:#fff;border:0;border-radius:14px;padding:12px 30px;cursor:pointer}
#err{color:#d6336c;min-height:1.4em;font-size:.9rem;margin-top:10px}
.hearts i{opacity:.35}
section{position:relative;z-index:1}
.hid{display:none}
.box{max-width:460px;margin:5vh auto 0;background:rgba(255,255,255,.55);border-radius:20px;padding:20px 16px;line-height:2;font-weight:600;text-align:right;font-size:1.02rem}
.box p{margin:0 0 12px}
.box p.cur::after{content:"|";margin-right:2px;animation:bl .8s steps(1) infinite;color:#ff6fa3}
@keyframes bl{50%{opacity:0}}
#next{margin:34px auto 30px;opacity:0;transition:opacity 1.6s}
#next.on{opacity:1}
.soft{font-weight:400;opacity:.7;margin-bottom:14px;font-size:.95rem}
.sq{width:150px;height:150px;border:0;border-radius:26px;background:linear-gradient(160deg,#ffb3d0,#ff6fa3);color:#fff;font:inherit;font-size:1.25rem;font-weight:700;letter-spacing:.5px;cursor:pointer;box-shadow:0 8px 20px rgba(255,111,163,.4)}
.sq:active{transform:scale(.96)}
</style>
</head>
<body>
<div id="lock"><div style="font-size:2.4rem">🔒💗</div>
<div style="font-weight:700;margin-top:8px">الويب سايت ده مخصوص لملك بس</div>
<div style="font-size:.85rem;opacity:.75;margin-top:6px">اكتبي تاريخ أول يوم اتعرفنا فيه (يوم شهر سنة) بالأرقام من غير أصفار</div>
<input id="pw" type="text" inputmode="numeric" autocomplete="off" placeholder="••••••••">
<button id="go">فتح 💗</button><div id="err"></div></div>

function b(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
function norm(v){return v.replace(/[٠-٩]/g,function(d){return d.charCodeAt(0)-1632}).replace(/\D/g,'')}
async function dec(pw){
var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(S),iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b(I)},k,b(D)));}
async function tryOpen(){
var e=document.getElementById('err');e.textContent='';
au.muted=true;try{au.play().catch(function(){})}catch(x){}
try{var html=await dec(norm(document.getElementById('pw').value));
au.muted=false;
document.getElementById('lock').remove();
var a=document.getElementById('app');a.innerHTML=html;
a.querySelectorAll('script').forEach(function(o){var n=document.createElement('script');n.textContent=o.textContent;o.replaceWith(n)});
}catch(x){au.pause();au.currentTime=0;e.textContent='مش دي يا قمر، جربي تاني 💗'}}
document.getElementById('go').onclick=tryOpen;
document.getElementById('pw').onkeydown=function(e){if(e.key==='Enter')tryOpen()};
</script>
